<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Detailed Sensor Data</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="container">
    <aside class="sidebar">
      <h2>Dashboard</h2>
      <ul>
        <li><a href="Analytics.html">Analytics</a></li>
        <li>Settings</li>
      </ul>
    </aside>
    
    <main class="main">
      <h1>Detailed Sensor Data</h1>
      <input type="text" id="searchInput" placeholder="Search sensors..." onkeyup="filterTable()" />

      <table>
        <thead>
          <tr>
            <th>Sensor ID</th>
            <th>Oil Leakage (L)</th>
            <th>Real Time Monitoring</th>
            <th>Time Interval</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="sensorTable">
          <!-- JS will populate this -->
        </tbody>
      </table>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
